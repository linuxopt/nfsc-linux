[advanced]
# Asynchronous Shaders: Skip an object for a frame or two while its shader compiles, instead of stuttering.
# True or false. (NFSMW_ASYNC_PIPELINES)
async_shaders = true

# Performance Overlay: Show the frame rate and frame time in a corner of the screen.
# True or false. (NFSMW_PERF_OVERLAY)
performance_overlay = false

[game]
# Language: The language of the game's menus and race text: English (the USA disc's), or French, German, Italian, Spanish, Dutch, Swedish, Danish, Polish or Finnish, from the same disc's files. The movies and the speech stay in English, as the disc has them. The European (PAL) Spanish disc has Spanish movies and speech, and starts in Spanish; another language there keeps them in Spanish.
# One of "english", "french", "german", "italian", "spanish", "dutch", "swedish", "danish", "polish", "finnish". (NFSMW_LANGUAGE; applies at the next launch)
language = "english"

[app]
# The SpeedBreaker version that ran last (the game keeps this up to date).
